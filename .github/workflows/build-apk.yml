name: Build ShikkhaScan APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk ShikkhaScan.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShikkhaScan-APK
          path: ShikkhaScan.apk

      - name: Publish APK to GitHub Releases
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ShikkhaScan Latest APK
          body: |
            Automated Android APK build for ShikkhaScan.
            Download **ShikkhaScan.apk** below and open it on your Android phone to install.
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: ShikkhaScan.apk
